name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - name: Код и подмодули (ядро Xray, туннель)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          sed -i "10i\\        ndkVersion = \"${NDK_VERSION}\"" V2rayNG/app/build.gradle.kts

      - name: Кэш туннеля (libhevtun)
        id: hevtun-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ env.NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Сборка туннеля (libhevtun)
        if: steps.hevtun-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Ядро Xray (libv2ray.aar) той же версии, что подмодуль
        run: |
          cp -r libs V2rayNG/app
          TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          echo "AndroidLibXrayLite: $TAG"
          mkdir -p V2rayNG/app/libs
          curl -fsSL -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ключ подписи (из секретов, если есть)
        env:
          KS: ${{ secrets.MAYAK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/mayak.jks"
            echo "MAYAK_KEYSTORE_FILE=$RUNNER_TEMP/mayak.jks" >> $GITHUB_ENV
            echo "Подпись: ключ из секретов"
          else
            echo "Подпись: тестовый ключ из репозитория (только для тестов)"
          fi

      - name: Сборка APK
        env:
          MAYAK_KEYSTORE_PASSWORD: ${{ secrets.MAYAK_KEYSTORE_PASSWORD }}
          MAYAK_KEY_ALIAS: ${{ secrets.MAYAK_KEY_ALIAS }}
          MAYAK_KEY_PASSWORD: ${{ secrets.MAYAK_KEY_PASSWORD }}
        run: |
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew licenseFdroidReleaseReport
          ./gradlew assemblePlaystoreRelease
          ls -la app/build/outputs/apk/playstore/release/

      - name: APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: MayakVPN-apk
          path: V2rayNG/app/build/outputs/apk/playstore/release/*.apk

      - name: Тестовая сборка — постоянная ссылка для скачивания
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd V2rayNG/app/build/outputs/apk/playstore/release
          for f in MayakVPN_*_universal.apk; do cp "$f" MayakVPN-test.apk; done
          for f in MayakVPN_*_arm64-v8a.apk; do cp "$f" MayakVPN-test-arm64.apk; done
          gh release delete test-latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create test-latest MayakVPN-test.apk MayakVPN-test-arm64.apk -R "$GITHUB_REPOSITORY" \
            --prerelease --title "Тестовая сборка" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. MayakVPN-test.apk — для любого телефона, MayakVPN-test-arm64.apk — меньше, для большинства современных."
